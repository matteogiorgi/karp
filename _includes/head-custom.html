<style>
  /* the last table on each doc page is always the prev/README/next footer nav */
  table:last-of-type { width: 100%; }
  table:last-of-type thead { display: none; }
  table:last-of-type tbody { display: block; width: 100%; }
  table:last-of-type tr {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 100%;
  }
  table:last-of-type td {
    display: block;
    border: none;
    white-space: nowrap;
  }
  table:last-of-type td:nth-child(1) { text-align: left; }
  table:last-of-type td:nth-child(2) { text-align: center; }
  table:last-of-type td:nth-child(3) { text-align: right; }
</style>

<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false });
  window.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    mermaid.run();
  });
</script>

<style>
  /* Applied only to tables JS below tags as .nav-footer-table — the
     prev/README/next footer nav in docs/*.md. Deliberately NOT
     table:last-of-type: README.md has two ordinary content tables of its
     own, so "the last table on the page" is not a safe way to identify
     the footer nav once a page has more than one real table on it. */
  table.nav-footer-table { width: 100%; }
  table.nav-footer-table thead { display: none; }
  table.nav-footer-table tbody { display: block; width: 100%; }
  table.nav-footer-table tr {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    width: 100%;
  }
  table.nav-footer-table td {
    display: block;
    border: none;
    white-space: nowrap;
  }
  table.nav-footer-table td:nth-child(1) { text-align: left; }
  table.nav-footer-table td:nth-child(2) { text-align: center; }
  table.nav-footer-table td:nth-child(3) { text-align: right; }
</style>

<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$']],
    displayMath: [['$$', '$$']]
  }
};
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: false });
  window.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = code.textContent;
      code.parentElement.replaceWith(div);
    });
    mermaid.run();
  });
</script>

<script>
  // Tag the prev/README/next footer nav table (docs/*.md) so the CSS above
  // can target it without relying on table position. The footer nav is the
  // only table whose header row is entirely blank — it exists solely to
  // satisfy kramdown's "a table needs at least one data row below its
  // header" requirement (see DEVLOG.md) — so an empty header row is a
  // reliable, page-position-independent signature for it.
  window.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll("table").forEach((table) => {
      const headerCells = table.querySelectorAll("thead th");
      const isBlankHeader =
        headerCells.length > 0 &&
        Array.from(headerCells).every((th) => th.textContent.trim() === "");
      if (isBlankHeader) {
        table.classList.add("nav-footer-table");
      }
    });
  });
</script>
